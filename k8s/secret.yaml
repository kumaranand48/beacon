apiVersion: v1
kind: Secret
metadata:
  name: beacon
  namespace: beacon
type: Opaque
stringData:
  # Firebase Auth (backend token verification)
  FIREBASE_PROJECT_ID: ""
  # Google service account JSON (GA4 Data API + Firebase Admin)
  GOOGLE_APPLICATION_CREDENTIALS: /etc/beacon/service-account.json
  # GA4 property ID
  GA4_PROPERTY_ID: ""
  # AWS credentials (or use IRSA / instance profiles instead)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
